media:
    input: app/public/images
    output: /images
    extensions: [png, jpg, jpeg, webp]

content:
    - name: quiz_files
      label: Quiz Files
      type: collection
      path: app/public/quiz
      format: json
      filename: "{primary}.json"
      view:
          fields:
              - title
              - category
              - level
              - primary
      fields:
          - name: primary
            label: File ID (e.g. tsurumi-easy)
            type: string
            required: true
          - name: title
            label: Quiz Title
            type: string
          - name: category
            label: Category
            type: string
          - name: subject
            label: Subject
            type: string
          - name: level
            label: Level (easy, normal, hard)
            type: string
          - name: thumbnail
            label: Thumbnail Image
            type: image
          - name: icon
            label: Icon (e.g. mdi-train)
            type: string
          - name: color
            label: Color (e.g. yellow-darken-3)
            type: string
          - name: comingSoon
            label: Coming Soon
            type: boolean
          - name: chapters
            label: Chapters
            type: object
            list: true
            fields:
                - name: chapter
                  label: Chapter number
                  type: number
                - name: questions
                  label: Questions
                  type: object
                  list: true
                  fields:
                      - name: id
                        label: UUID / ID
                        type: string
                      - name: quiz_type
                        label: Quiz Type (four_choice or free_input)
                        type: string
                      - name: image
                        label: Question Image
                        type: image
                      - name: question
                        label: Question Text
                        type: string
                      - name: choices
                        label: Choices (for 4-choice)
                        type: string
                        list: true
                      - name: answer
                        label: Answer
                        type: string
                      - name: accept_answers
                        label: Accept Answers (for free input)
                        type: string
                        list: true
                      - name: explanation
                        label: Explanation
                        type: string